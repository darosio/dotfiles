# Backend preferences for xdg-desktop-portal (see portals.conf(5)).
#
# Only [preferred] is a valid group; an earlier version of this file used
# [org.freedesktop.portal.Desktop], which the daemon ignores entirely.
#
# wlr is the only backend here providing Screenshot and ScreenCast, which is
# what sway needs; gtk provides FileChooser, AppChooser, Print and the rest.
# The previous FileChooser=termfilechooser line named a backend that is not
# installed -- see TODO [yazi-file-dialogs] if that experiment is revisited.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
