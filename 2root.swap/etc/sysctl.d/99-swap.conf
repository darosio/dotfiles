# Swap tuning for a 123 GiB compute workstation.
#
# Swap here is a safety net for allocation spikes, not a memory tier. A low
# swappiness keeps the kernel from preemptively paging out hot MCMC/fit arrays
# that are still in the working set; reclaim then prefers dropping page cache,
# which is cheap to refill, over evicting anonymous pages.
vm.swappiness = 10
