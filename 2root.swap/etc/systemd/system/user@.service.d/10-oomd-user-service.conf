# Managed by dotfiles -- 2root.swap.sh installs this as a real file.
#
# PSI-based kill for the interactive session tree. When memory pressure inside
# user@.service stays above the limit for DefaultMemoryPressureDurationSec,
# oomd kills the descendant cgroup contributing most of it. Compute launched in
# its own scope (see the header of 2root.swap.sh) is therefore the victim,
# rather than the whole session dying to the kernel OOM killer.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
