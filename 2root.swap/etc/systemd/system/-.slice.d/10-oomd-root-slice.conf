# Managed by dotfiles -- 2root.swap.sh installs this as a real file.
#
# systemd-oomd only acts on cgroups that opt in. Enabling the service alone
# does nothing. Monitoring swap usage from the root slice means oomd reacts
# once the 16 GiB swapfile is nearly consumed, before the box starts thrashing.
[Slice]
ManagedOOMSwap=kill
