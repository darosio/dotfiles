use_default_settings: true
server:
  secret_key: "CHANGE_THIS_TO_A_LONG_RANDOM_STRING"
  bind_address: "0.0.0.0"
  port: 8080
  public_instance: false
  limiter: false
  allowed_media_types:
    - text/html
    - application/json
engines:
  - name: google scholar
    disabled: false
    categories: [general, science]
  - name: pubmed
    disabled: false
    categories: [general, science]
  - name: semantic scholar
    disabled: false
    categories: [general, science]
  - name: arxiv
    disabled: false
    categories: [general, science]
  - name: crossref
    disabled: false
    categories: [general, science]
  - name: wolframalpha
    disabled: false
    categories: [general, science]
  - name: wikidata
    disabled: true
  # Disabled: these consistently fail on this instance and, because SearXNG
  # waits for every enabled engine, they were adding ~11s to every query --
  # long enough that mcp-searxng aborted the request before results arrived.
  # Measured 2026-08-27: brave/startpage/qwant unresponsive, semantic scholar
  # unresponsive; pubmed/arxiv/crossref/google-scholar/duckduckgo/bing all OK.
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: semantic scholar
    disabled: true
categories_as_tabs:
  general:
    - general
  science:
    - science
  news:
    - news
  images:
    - images
outgoing:
  # Cap how long SearXNG waits on any single engine. Without this a newly
  # blocked engine silently reintroduces the timeout stall above.
  request_timeout: 4.0
  max_request_timeout: 6.0
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
