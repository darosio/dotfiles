# Arch's 20-systemd-userdb.conf sets an AuthorizedKeysCommand pointing at
# userdbctl, which is useless on a system that does not run systemd-homed and
# gets consulted on every login attempt.
#
# sshd keeps the FIRST value it obtains for a keyword, and sshd_config.d drop-ins
# are included at the top of sshd_config in lexical order, so this file wins by
# sorting before 20-. Doing it here rather than editing the packaged drop-in
# means an openssh upgrade cannot silently restore the setting.
AuthorizedKeysCommand none
AuthorizedKeysFile .ssh/authorized_keys
