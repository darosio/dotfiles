[Service]
ExecStart=
ExecStart=/usr/sbin/sshd -D -o Port=23456 -o PermitRootLogin=no -o PasswordAuthentication=no -o MaxAuthTries=3 -o LogLevel=VERBOSE -o AllowTcpForwarding=no -o AllowAgentForwarding=no

# Hardening.
# NOTE: sshd forks user sessions inside this unit's sandbox, so anything that
# restricts the filesystem is inherited by the interactive login. Do NOT set:
#   ProtectHome=true     -> sshd cannot read ~/.ssh/authorized_keys (locks you out)
#   NoNewPrivileges=true -> sudo stops working inside ssh sessions
#   PrivateTmp=true      -> sessions get an isolated /tmp (breaks tmux/X sockets)
ProtectSystem=full
