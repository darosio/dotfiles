[[mgr.prepend_keymap]]
on = ["g", "S"]
run = 'search --via=rga'
desc = "Search (rga)"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = 'search_do --via=fd --args="-tf -d3"'
desc = "Search flat view 3"

[[mgr.prepend_keymap]]
on = [",", ","]
run = ["sort mtime --reverse"]
desc = "Sort by modified time (reverse)"

# Go to Places
[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd /home/dati/"
desc = "Go /home/dati"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Sync/tmp/PrtSc/"
desc = "Go ~/Sync/tmp/PrtSc"

[[mgr.prepend_keymap]]
on = ["g", "b"]
run = "cd ~/Sync/box/"
desc = "Go ~/Sync/box"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/Sync/notes"
desc = "Go ~/Sync/notes"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/workspace"
desc = "Go ~/workspace"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go back to git root"

[[mgr.prepend_keymap]]
on = "q"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# Copy selected files to the system clipboard while yanking
[[mgr.prepend_keymap]]
on = "Y"
run = ['shell -- for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank"]

# smart-paste without entering destination folder
[[mgr.prepend_keymap]]
on = "p"
run = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on = "t"
run = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

# Confirm before quitting if multiple tabs are open
[[mgr.prepend_keymap]]
on = "Q"
run = "plugin confirm-quit"

# Hide/Show preview:
[[mgr.prepend_keymap]]
on = "\\"
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

# Maximize/Restore preview:
[[mgr.prepend_keymap]]
on = "|"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "="
run = "shell 'chmod %s' --block --cursor=6 --interactive"
desc = "Change permissions of selected files"

# Ranger-style "Open with" (type command manually)
[[mgr.prepend_keymap]]
on = "o"
run = 'shell --block --interactive --cursor=0 " \"$@\""'
desc = "Open with (manual command)"

[[mgr.prepend_keymap]]
on = ["<A-TAB>"]
run = '''shell --
{
  # 1. Run git annex info, suppress errors, capture output
  GIT_OUTPUT=$(git annex info --bytes --fast "$@" 2>/dev/null);

  # 2. Extract the byte size and convert it to human-readable format (e.g., 2.2G)
  #    `numfmt` is the standard GNU tool for this and is more reliable than awk/printf for unit conversion.
  SIZE_BYTES=$(echo "$GIT_OUTPUT" | awk '/local annex size/ {print $4}');
  HUMAN_SIZE=$(echo "$SIZE_BYTES" | numfmt --to=iec --suffix=B);

  # 3. Check for a valid size and display the result via Zenity
  if [[ -z "$SIZE_BYTES" || "$SIZE_BYTES" == "0" ]]; then
    zenity --warning --title="Git-Annex Info" --text="Not a Git-Annex repository, or no annexed content found."
  else
    zenity --info --title="Git-Annex Total Size" --text="Total annexed size: \n${HUMAN_SIZE}"
  fi
}'''
desc = "Show Git-Annex total size (Human Readable)"

# email selected files
# NOT <C-m>: terminals without the kitty keyboard protocol (tmux, ssh into a
# plain xterm) send \r for both <C-m> and <Enter>, which would hijack "open".
[[mgr.prepend_keymap]]
on = "<C-e>"
run = '''shell --block --
    # Yazi rewrites a literal %s in this command to the space-joined selected
    # paths, which silently ate printf's format specifier and collapsed every
    # selection into one path. Every printf format below is therefore written
    # %%s, which yazi unescapes to %s before running the command.

    # 1. Build an elisp list of the selected paths: ("/a/b" "/c/d").
    #    A list, not a comma-joined string, so a comma in a filename is safe.
    elisp_list='('
    for p in "$@"; do
      # Escape backslashes first, then double quotes, for the Lisp string.
      esc=$(printf '%%s' "$p" | sed 's/\\/\\\\/g; s/"/\\"/g')
      elisp_list="$elisp_list\"$esc\" "
    done
    elisp_list="$elisp_list)"

    # 2. -c creates a new frame, -n returns without waiting for it to close.
    emacsclient -c -n -e "(mu4e-compose-new-with-attachments '$elisp_list)"
'''
desc = "Compose mu4e message with selected file attachments"

[[input.prepend_keymap]]
on = "<C-g>"
run = "close"
desc = "Cancel input"
