[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
linemode = "size"
show_symlink = false

[opener]
# `run` fields use yazi's own opener placeholders (%s, %s1, ...), not shell
# "$@" - yazi only substitutes %-tokens into `run` before shell-executing it;
# it never passes selected files as positional shell parameters, so a literal
# "$@" has nothing to expand from and openers silently get zero paths.
jupyter = [{ run = 'foot bash -c "jupyter-lab %s"', block = false, orphan = true, desc = "Jupyter" }]
nbpeek = [{ run = 'jupyter nbconvert --to markdown %s --stdout | bat', block = true, desc = "Preview Notebook" }]
csvlens = [{ run = 'csvlens %s', block = true, desc = "CSV Lens" }]
browser = [{ run = 'firefox %s', orphan = true, desc = "Firefox" }]
edit = [
  # orphan: $EDITOR is `emacsclient -c`, whose frame must outlive yazi
  { run = '$EDITOR %s', block = false, orphan = true, desc = "Terminal Editor" },
  { run = 'gvim %s', orphan = true, desc = "GV Vim" },
]
open = [
  { run = 'handlr open %s', desc = "Open" },
  { run = 'handlr open -e true %s', desc = "Open menu" },
]
manual = [
  { run = 'ya emit shell --block --interactive --cursor=0 " %s"', desc = "Manual" },
]

[open]
prepend_rules = [
  # Using 'url' instead of 'name' for glob matching
  { url = "*.{html,htm,xhtml}", use = ["browser", "edit", "open", "manual"] },
  { url = "*.csv", use = ["csvlens", "edit", "open", "manual"] },
  { url = "*.ipynb", use = ["jupyter", "nbpeek", "edit", "open", "manual"] },
  { url = "*.py", use = ["edit", "open", "manual"] },
  { url = "*.{json,sh}", use = ["edit", "open", "manual"] },
  { url = "*.zip", use = ["extract", "open", "manual"] },
  { url = "*.{org,md,txt}", use = ["edit", "open", "manual"] },
  { url = "*/", use = ["open", "reveal", "edit", "manual"] },
  { url = "*", use = ["open", "edit", "manual"] },
]

[plugin]
prepend_previewers = [
  # First: never preview anything under /remote, previewing would hit the mount.
  # Rules match in order, so this has to precede every rule below.
  { url = "/remote/**", run = 'noop' },
  # DjVu is image/vnd.djvu, so it has to precede the image/* rule below
  { url = "*.{djvu,djv}", run = "djvu-view" },
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { url = "*.csv", run = 'piper -- bat --color=always --style=grid,numbers "$1"' },
  # HTML preview
  { url = "*.{html,htm,xhtml}", run = 'piper -- sh -c "w3m -dump -T text/html \"$1\" 2>/dev/null || pandoc -t plain -- \"$1\" 2>/dev/null || echo \"No HTML preview available\""' },
  { mime = "application/epub+zip", run = "piper -- bash -lc 'ebook-meta \"$1\" 2>/dev/null | sed -n \"/^Title[[:space:]]*:/p;/^Author(s)[[:space:]]*:/p;/^Publisher[[:space:]]*:/p;/^Published[[:space:]]*:/p;/^Languages[[:space:]]*:/p\"; printf \"\\n--- contents ---\\n\"; bsdtar -tvf \"$1\" 2>/dev/null | sed -n \"1,120p\"' bash \"$1\"" },
  { url = "*.chm", run = 'piper -- extract_chmLib "$1" --' },
  { url = "*/", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes --all "$1"' },
  { url = "*.eml", run = 'piper -- view_mail_html.py "$1"' },
  { mime = "message/rfc822", run = 'piper -- mu view -- "$1"' },
  { url = "*.cab", run = 'piper -- sh -c "bsdtar --list --file \"$1\" 2>/dev/null || file -bL \"$1\""' },
  # Office Documents
  { mime = "application/openxmlformats-officedocument.*", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { url = "*.docx", run = "office" },
  { url = "*.sxw", run = "office" },
  # Archive previewer
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/*tar", run = "ouch" },
  { mime = "application/*bzip2", run = "ouch" },
  { mime = "application/*7z-compressed", run = "ouch" },
  { mime = "application/*rar", run = "ouch" },
  { mime = "application/*xz", run = "ouch" },
  { mime = "application/*zstd", run = "ouch" },
  { mime = "application/java-archive", run = "ouch" },
]

prepend_preloaders = [
  # Same ordering constraint as the previewers above
  { url = "*.{djvu,djv}", run = "djvu-view" },
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
  { mime = "application/postscript", run = "mediainfo" },
  # Office Documents
  # Combined into a single rule (was 4) to stay under yazi's 16-preloader cap,
  # since yazi's own default preset now ships 8 preloaders.
  { mime = "application/{openxmlformats-officedocument.*,oasis.opendocument.*,ms-*,msword}", run = "office" },
  { url = "*.docx", run = "office" },
]

append_previewers = [
  # My fallback previewer
  { mime = "*", run = "binary" },
]

[[plugin.prepend_fetchers]]
id = "git"
mime = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"
